# https://github.com/SilentVoid13/Templater/blob/master/.github/workflows/release.yml
name: Plugin release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch all branches
        run: git fetch --all

      - name: Extract branch name
        run: |
          BRANCH_NAME=$(git name-rev --name-only $GITHUB_SHA | sed 's|^remotes/origin/||' | sed 's|^origin/||')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      # Use the section for this version in release-notes/release.md; fail if it is missing
      - name: Write release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          awk -v v="$VERSION" '$1 == "##" { p = ($2 == v); next } p' release-notes/release.md > "$RUNNER_TEMP/release-notes.md" 2>/dev/null \
            || : > "$RUNNER_TEMP/release-notes.md"
          if [ -z "$(sed '/<!--/,/-->/d' "$RUNNER_TEMP/release-notes.md" | tr -d '[:space:]')" ]; then
            echo "::error::Add a \"## $VERSION\" section with release notes to release-notes/release.md, then tag again."
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              git push origin --delete "$GITHUB_REF"
              echo "::error::The tag was deleted on GitHub. Delete it locally too: git tag -d $VERSION"
            fi
            exit 1
          fi

      # Checkout the main branch to update manifest.json
      - name: Checkout main branch to update manifest
        run: |
          git checkout main
          git pull origin main

      - name: Update manifest.json in main branch
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          jq --arg version "$VERSION" '.version = $version' manifest.json > manifest-temp.json
          mv manifest-temp.json manifest.json

      - name: Commit and push manifest.json changes in main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add manifest.json
          git commit -m "Update manifest.json to version $VERSION" || echo "No changes to commit"
          git push origin main


      - name: Ensure HEAD is at updated main commit
        run: |
            git fetch origin
            git checkout main
            git reset --hard origin/main

      - name: npm build
        run: |
          npm install
          npm run fn-build --if-present

      - name: Generate artifact attestation for main.js
        uses: actions/attest@v4
        with:
          subject-path: 'main.js'

      - name: Generate artifact attestation for styles.css
        uses: actions/attest@v4
        with:
          subject-path: 'styles.css'

      - name: Create Plugin release
        uses: ncipollo/release-action@v1.12.0
        with:
          artifacts: "main.js,manifest.json,styles.css"
          bodyFile: ${{ runner.temp }}/release-notes.md
          allowUpdates: true
          omitBodyDuringUpdate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}

      - name: Announce on Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASE }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "No DISCORD_WEBHOOK_RELEASE secret set, skipping"; exit 0; fi
          VERSION=${GITHUB_REF#refs/tags/}
          NOTES=$(sed '/<!--/,/-->/d' "$RUNNER_TEMP/release-notes.md" \
            | sed -E "s|#([0-9]+)|[#\1](https://github.com/$GITHUB_REPOSITORY/issues/\1)|g")
          jq -n --arg title "Folder Notes $VERSION" \
            --arg url "https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION" \
            --arg notes "$NOTES" \
            '{embeds: [{title: $title, url: $url, description: $notes[:4000], color: 3066993}]}' \
            | curl -fsS -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
